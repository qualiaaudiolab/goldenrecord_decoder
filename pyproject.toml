[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "grdecoder"
version = "1.0.0"
description = "Decoder for the pictures of the Voyager Golden Record, with sync-locked wow/flutter correction"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "soundfile>=0.12",
    "Pillow>=10",
    "PySide6>=6.5",
    "pyqtgraph>=0.13.3",
    "sounddevice>=0.4.6",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
grdecoder = "grdecoder.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
grdecoder = ["gui/icon.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
